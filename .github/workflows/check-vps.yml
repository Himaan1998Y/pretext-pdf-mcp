name: Check VPS
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 57.129.125.171
          username: antigravity
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 49222
          script: |
            echo "=== Docker networks ==="
            docker network ls
            echo "=== coolify-proxy networks ==="
            docker inspect coolify-proxy --format '{{json .NetworkSettings.Networks}}' | python3 -c "import sys,json; d=json.load(sys.stdin); [print(k) for k in d.keys()]"
            echo "=== Traefik entrypoints ==="
            docker inspect coolify-proxy --format '{{json .Config.Cmd}}'
